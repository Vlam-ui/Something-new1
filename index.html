<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>'n Klein boodskap vir jou</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f1ea;color:#2b211b;font-family:Georgia,"Times New Roman",serif}

.phone{font:18px Arial,sans-serif;margin-top:9px;letter-spacing:.3px}
.extra{margin-top:28px;font-size:20px;line-height:1.5;font-style:italic}
.divider{width:70px;height:1px;background:#c8b8aa;margin:25px auto}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<img src="coffee.png" alt="Twee koppies koffie">
<div class="content">
<div class="message">Hi, ek dink jy is ongelooflik mooi en antreklik. Jou skoonheid maak my eintelik te skaam om persoonlik met jou te praat, maar ek sal graag wil weet of jy dalk saam met my op n coffee date sal wil gaan as jy belangstel.</div>
<div class="name">Dieter</div>
<div class="phone">+2783 751 4119</div>
<div class="divider"></div>
<div class="extra">As jy toe nie belangstel nie dan is di took cool</div>
</div>
<img src="handshake.png" alt="Handdruk">
</section>
</main>
</body>
</html>
